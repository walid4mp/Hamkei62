plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// Release signing. Secrets live in android/key.properties (git-ignored) and the
// keystore file is never committed. When key.properties is absent (local dev,
// CI without secrets) we fall back to the debug signing config so the release
// APK still builds; store builds must provide the keystore.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.socialnova.app'
    compileSdk 36

    // Keep Java and Kotlin bytecode targets identical (JDK 17) to avoid
    // "Inconsistent JVM-target compatibility" build failures.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.socialnova.app'
        minSdk 24
        targetSdk 35
        versionCode 32
        versionName '4.0.0'
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    // Required so the release variant really emits an APK at
    // build/app/outputs/flutter-apk/app-release.apk (the path Flutter expects).
    buildTypes {
        release {
            // Real keystore when configured, debug signing otherwise.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

// Firebase is enabled automatically when google-services.json is present.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}


dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
