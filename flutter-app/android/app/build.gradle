plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.socialnova.app'
    compileSdk 36

    // Keep Java and Kotlin bytecode targets identical (JDK 17) to avoid
    // "Inconsistent JVM-target compatibility" build failures.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.socialnova.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '3.0.0'
    }

    // Required so the release variant really emits an APK at
    // build/app/outputs/flutter-apk/app-release.apk (the path Flutter expects).
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

// Firebase is enabled automatically when google-services.json is present.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
