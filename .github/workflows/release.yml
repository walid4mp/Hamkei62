name: Release

# CI proves a change is safe. CD ships it. Keeping them in one file is how
# you end up building a signed release bundle on every pull request.
on:
  # push:
  #   tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Artifact to produce"
        required: true
        default: aab
        type: choice
        options: [aab, apk, both]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.3"

jobs:
  release:
    name: Build signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      # Re-run the gates. A tag can point at any commit, including one that
      # never went through a PR.
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ] || [ -z "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            echo "::error::Firebase secrets are missing. Configure GOOGLE_SERVICES_JSON_BASE64 and FIREBASE_OPTIONS_DART_BASE64 in repository Actions secrets."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 -d > lib/firebase_options.dart

      - name: Restore dart-define file
        env:
          DART_DEFINE_ENV_BASE64: ${{ secrets.DART_DEFINE_ENV_PROD_BASE64 }}
        run: |
          if [ -z "$DART_DEFINE_ENV_BASE64" ]; then
            echo "::error::DART_DEFINE_ENV_PROD_BASE64 is not set. See docs/ci-cd.md."
            exit 1
          fi
          echo "$DART_DEFINE_ENV_BASE64" | base64 -d > ci.env

      # android/app/build.gradle.kts reads `key.properties` with exactly
      # these four keys (verified against the checked-in Gradle script).
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 (and the password/alias secrets) are not set. Release signing cannot proceed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Resolve version
        id: version
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          echo "app_version=${RAW:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build App Bundle
        if: inputs.build_type != 'apk'
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=ci.env \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }} \
            --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER} \
            --dart-define=COMMIT_SHA=${GITHUB_SHA::7}

      - name: Build split APKs
        if: inputs.build_type != 'aab'
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=ci.env \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }} \
            --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER} \
            --dart-define=COMMIT_SHA=${GITHUB_SHA::7}

      - name: Clean up secrets
        if: always()
        run: |
          rm -f ci.env android/key.properties android/app/upload-keystore.jks
          rm -f android/app/google-services.json lib/firebase_options.dart

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk

      # NOT IMPLEMENTED ON PURPOSE — Play Store upload.
      # It needs a service-account JSON with Play Developer API access.
      # Add Fastlane's `supply` action here once the account is provisioned.
