name: Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Test
        run: flutter test

      # Decode the release keystore from repository secrets. When the secrets
      # are absent the build falls back to debug signing (still a valid APK for
      # testing). Secrets are NEVER written into the repository.
      - name: Configure release signing (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://hamkei62.onrender.com' }} --dart-define=SOCKET_URL=${{ vars.SOCKET_URL || 'https://hamkei62.onrender.com' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialNova-APK
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
