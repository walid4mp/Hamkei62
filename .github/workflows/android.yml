name: Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check src/server.js
      - name: Prisma schema validation
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/socialnova?schema=public
      - name: Unit tests (gifts + permissions + catalog)
        run: npm test

  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    # V93: the `secrets` context is NOT available inside a step `if:` — that
    # made the whole workflow a startup_failure (no jobs, instant red run).
    # Secrets are mapped to job-level env and the condition reads `env.*`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # V95: the production APK must always target the live Render service.
      # Do not depend on a mutable repository variable for the API host.
      SOCIALNOVA_API_URL: https://hamkei62.onrender.com
      SOCIALNOVA_SOCKET_URL: https://hamkei62.onrender.com
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      UPDATE_BROADCAST_SECRET: ${{ secrets.UPDATE_BROADCAST_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Configure Firebase Android (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Test
        run: flutter test

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: flutter-app/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      # Decode the release keystore from repository secrets. When the secrets
      # are absent the build falls back to debug signing (still a valid APK for
      # testing). Secrets are NEVER written into the repository.
      - name: Configure release signing (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          storeFile=../upload-keystore.jks
          EOF

      - name: Verify production API before APK build
        run: |
          set -euo pipefail
          echo "Checking $SOCIALNOVA_API_URL/api/health"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$SOCIALNOVA_API_URL/api/health" | grep -q '"ok":true'

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_URL=$SOCIALNOVA_API_URL --dart-define=SOCKET_URL=$SOCIALNOVA_SOCKET_URL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialNova-APK
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^version: \([^+]*\)+.*/\1/p" pubspec.yaml | head -n1)"
          VERSION_CODE="$(sed -n "s/^version: [^+]*+\([0-9][0-9]*\).*/\1/p" pubspec.yaml | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME+$VERSION_CODE"

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SocialNova-${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}.apk"

      - name: Publish GitHub Release (main pushes and v* tags)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}
          name: SocialNova v${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}
          body: |
            SocialNova v${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}

            تحديث تلقائي تم إنشاؤه بعد نجاح بناء APK واختبارات المشروع.
          files: |
            flutter-app/build/app/outputs/flutter-apk/SocialNova-${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}.apk
          generate_release_notes: true
          make_latest: true

      - name: Broadcast update to SocialNova users
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.UPDATE_BROADCAST_SECRET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}/SocialNova-${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}.apk"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
            -H "Content-Type: application/json" \
            -H "X-Update-Secret: $UPDATE_BROADCAST_SECRET" \
            -d "{\"versionCode\":${{ steps.app_version.outputs.version_code }},\"versionName\":\"${{ steps.app_version.outputs.version_name }}\",\"apkUrl\":\"$APK_URL\",\"releaseUrl\":\"https://github.com/${{ github.repository }}/releases/tag/v${{ steps.app_version.outputs.version_name }}+${{ steps.app_version.outputs.version_code }}\"}" \
            "$SOCIALNOVA_API_URL/api/admin/releases/broadcast-update"

      - name: Clean signing material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
