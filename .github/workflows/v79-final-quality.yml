name: SocialNova V79 Final Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --check src/seed.js
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/socialnova?schema=public
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/socialnova?schema=public

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SocialNova-V79-APK
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
