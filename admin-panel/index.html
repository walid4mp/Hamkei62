<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SocialNova Admin</title><style>body{margin:0;background:#070a12;color:#eee;font-family:system-ui}main{max-width:1000px;margin:auto;padding:30px}.card{background:#111725;border:1px solid #252d42;border-radius:18px;padding:20px;margin:12px 0}input,button{padding:12px;border-radius:10px;border:1px solid #30394f;background:#0b101c;color:#fff}button{cursor:pointer;background:#7157ff;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.num{font-size:28px;font-weight:800}</style></head><body><main><h1>SocialNova Admin</h1><div id="login" class="card"><input id="api" value="https://hamkei62.onrender.com" style="width:90%"><br><br><input id="email" placeholder="Admin email"><br><br><input id="pass" type="password" placeholder="Password"><br><br><button onclick="login()">دخول</button></div><section id="dash" hidden><div class="grid" id="stats"></div><div class="card"><h2>المستخدمون والمطورون</h2><p style="color:#9aa4bb">حسابات المطورين تملك صلاحيات الإدارة. المتابعون التجريبيون موضحون باسمهم ولا يمثلون مستخدمين حقيقيين.</p><div id="users">جارٍ التحميل...</div></div></section></main><script>let base='',token='';async function login(){base=document.querySelector('#api').value;let r=await fetch(base+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:email.value,password:pass.value})});let x=await r.json();if(!r.ok)return alert(x.error);token=x.token;loginBox(false);load()}function loginBox(h){document.querySelector('#login').hidden=h;document.querySelector('#dash').hidden=!h}async function load(){let h={Authorization:'Bearer '+token};let s=await (await fetch(base+'/api/admin/stats',{headers:h})).json();stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><div>${k}</div><div class="num">${v}</div></div>`).join('');let u=await (await fetch(base+'/api/admin/users',{headers:h})).json();users.innerHTML=u.map(x=>`<div class="card"><b>${x.displayName}</b> @${x.username} ${x.role==='DEVELOPER'?'🛠️':''}<br>${x.email} ${x.isBanned?'⛔':''}<br><button onclick="ban('${x.id}',${!x.isBanned})">${x.isBanned?'فك الحظر':'حظر'}</button> ${x.role==='DEVELOPER'?`<button onclick="demoFollowers('${x.id}')">+25 متابع تجريبي</button>`:''}</div>`).join('')}async function demoFollowers(id){let r=await fetch(base+'/api/admin/users/'+id+'/demo-followers',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({count:25})});let x=await r.json();alert(x.notice||('تمت الإضافة: '+x.added));load()}async function ban(id,b){await fetch(base+'/api/admin/users/'+id+'/ban',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({banned:b})});load()}</script></body></html>
